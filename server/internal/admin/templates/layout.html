<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="same-origin">
<meta name="theme-color" content="#FFD88C">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 108 108%22%3E%3Crect width=%22108%22 height=%22108%22 rx=%2228%22 fill=%22%23FFD88C%22/%3E%3Cpath d=%22M54 40c0-9 6-14 15-14 0 9-6 14-15 14z%22 fill=%22%237FB069%22/%3E%3Cpath d=%22M54 40c0-6-4-10-10-10 0 6 4 10 10 10z%22 fill=%22%239CC98A%22/%3E%3Crect x=%2251.5%22 y=%2238%22 width=%225%22 height=%228%22 rx=%222.5%22 fill=%22%23E07055%22/%3E%3Cpath d=%22M26 54a28 10 0 0 1 56 0z%22 fill=%22%23E07055%22/%3E%3Cpath d=%22M28 56h52v10a18 18 0 0 1-18 18H46a18 18 0 0 1-18-18z%22 fill=%22%23F4876A%22/%3E%3Ccircle cx=%2225%22 cy=%2262%22 r=%225%22 fill=%22none%22 stroke=%22%23F4876A%22 stroke-width=%224%22/%3E%3Ccircle cx=%2283%22 cy=%2262%22 r=%225%22 fill=%22none%22 stroke=%22%23F4876A%22 stroke-width=%224%22/%3E%3Cpath d=%22M38 66a16 12 0 0 0 10 10%22 fill=%22none%22 stroke=%22%23fff%22 stroke-width=%224%22 stroke-linecap=%22round%22 opacity=%22.6%22/%3E%3C/svg%3E">
<title>{{.Title}} · Mijote</title>
<script src="/admin/admin.js" defer></script>
<style>
/* "Sunny Kit" theme (requirements.md §8), same tokens as the app and the presentation site. */
:root{--butter:#FFD88C;--butter-light:#FFEBC2;--peach:#FFA98B;--peach-deep:#F4876A;--slate:#8E8E93;--bg:#FFF5E6;--card:#fff;--ink:#4A4A4A;--title:#6B6B6B;--soft:#A3A3A3;--track:#F0E6D8;--err:#C0583E;--err-bg:#FFE3D8;--shadow:0 6px 18px rgba(244,135,106,.18)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
header{position:relative;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;padding:16px 112px 20px 20px;background:var(--butter);border-radius:0 0 32px 32px;box-shadow:var(--shadow)}
header::after{content:"";position:absolute;top:0;right:0;width:84px;height:72px;background:var(--card) url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%2218 22 72 66%22%3E%3Cpath d=%22M54 40c0-9 6-14 15-14 0 9-6 14-15 14z%22 fill=%22%237FB069%22/%3E%3Cpath d=%22M54 40c0-6-4-10-10-10 0 6 4 10 10 10z%22 fill=%22%239CC98A%22/%3E%3Crect x=%2251.5%22 y=%2238%22 width=%225%22 height=%228%22 rx=%222.5%22 fill=%22%23E07055%22/%3E%3Cpath d=%22M26 54a28 10 0 0 1 56 0z%22 fill=%22%23E07055%22/%3E%3Cpath d=%22M28 56h52v10a18 18 0 0 1-18 18H46a18 18 0 0 1-18-18z%22 fill=%22%23F4876A%22/%3E%3Ccircle cx=%2225%22 cy=%2262%22 r=%225%22 fill=%22none%22 stroke=%22%23F4876A%22 stroke-width=%224%22/%3E%3Ccircle cx=%2283%22 cy=%2262%22 r=%225%22 fill=%22none%22 stroke=%22%23F4876A%22 stroke-width=%224%22/%3E%3Cpath d=%22M38 66a16 12 0 0 0 10 10%22 fill=%22none%22 stroke=%22%23fff%22 stroke-width=%224%22 stroke-linecap=%22round%22 opacity=%22.6%22/%3E%3C/svg%3E") center/44px no-repeat;border-bottom-left-radius:32px}
header b{font-weight:700;font-size:20px;color:var(--title);margin-right:auto;width:100%}
header a{color:var(--ink);text-decoration:none;padding:6px 12px;border-radius:14px;font-weight:600}header a:hover{background:rgba(255,255,255,.5)}header a.on{background:var(--peach-deep);color:#fff}
header button.link{color:var(--slate);font-weight:600;padding:6px 12px}
main{max-width:960px;margin:0 auto;padding:20px 16px 40px}
.card{background:var(--card);border-radius:22px;padding:20px 22px;margin:0 0 18px;box-shadow:var(--shadow)}
h1{font-weight:700;font-size:28px;color:var(--title);margin:12px 0 18px}h2{font-size:18px;font-weight:700;color:var(--title);margin-top:0}
a{color:var(--peach-deep);font-weight:600}
label{display:block;margin:8px 0}input[type=text],input[type=password],input[type=number],input[type=url],select,textarea{display:block;width:100%;max-width:320px;padding:8px 2px;border:0;border-bottom:2px solid var(--track);border-radius:0;background:transparent;font:inherit;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:0;border-bottom-color:var(--peach-deep)}
textarea{border:2px solid var(--track);border-radius:14px;padding:8px 10px;background:#fff}
button{background:var(--peach-deep);color:#fff;border:0;border-radius:14px;padding:9px 18px;font:inherit;font-weight:700;cursor:pointer}button:hover{filter:brightness(1.05)}button.link{background:none;color:var(--peach-deep);padding:0}
.error{background:var(--err-bg);color:var(--err);padding:10px 14px;border-radius:14px}.notice{background:var(--butter-light);border-left:4px solid var(--peach);padding:10px 14px;border-radius:14px}
.muted{color:var(--soft)}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:8px 10px;border-bottom:1px solid var(--track);vertical-align:top}th{color:var(--soft);font-size:12px;text-transform:uppercase;letter-spacing:1px;font-weight:600}
textarea{max-width:640px;min-height:90px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0 16px}.grid input,.grid select{max-width:none}label.check{display:inline-block;margin-right:16px}label.check input{display:inline;width:auto}
a.btn{display:inline-block;background:var(--peach-deep);color:#fff;border-radius:14px;padding:10px 18px;text-decoration:none}
button.secondary{background:var(--card);color:var(--peach-deep);box-shadow:inset 0 0 0 2px var(--peach)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center}.toolbar label{margin:0}.toolbar h2{margin:0 auto 0 0}
.tabs{display:inline-flex;gap:4px;padding:4px;background:var(--track);border-radius:16px}.tabs a{padding:5px 14px;border-radius:12px;color:var(--ink);text-decoration:none}.tabs a.on{background:var(--peach-deep);color:#fff}
.badge{display:inline-block;font-size:12px;font-weight:600;line-height:1.6;padding:0 8px;border-radius:8px;background:var(--butter-light);color:var(--title)}.badge.ok{background:#E3F0DC;color:#4F7A3E}.badge.off{background:var(--track);color:var(--slate)}
tr.day th{background:var(--butter-light);color:var(--title);font-size:14px;text-transform:none;letter-spacing:0;font-weight:700;padding-top:10px}
.steps{list-style:none;counter-reset:step;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin:0 0 18px;padding:0}
.steps li{counter-increment:step;display:grid;grid-template-columns:34px 1fr;gap:0 10px;padding:12px 14px;border-radius:18px;background:var(--card);color:var(--soft)}
.steps li::before{content:counter(step);grid-row:span 2;display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--track);color:var(--slate);font-weight:700}
.steps li b{color:var(--title)}.steps li span{font-size:13px}.steps li.on{box-shadow:var(--shadow);color:var(--ink)}.steps li.on::before{background:var(--peach-deep);color:#fff}.steps li.done::before{content:"✓";background:var(--butter);color:var(--title)}
.card.accent{border-top:6px solid var(--peach-deep)}
.share{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:flex-start}.share>div{flex:1 1 320px}.copy{display:flex;gap:8px;align-items:center;margin:6px 0}.copy input{max-width:none;flex:1;min-width:0}.copy button{white-space:nowrap}
.qr{margin:0;text-align:center;max-width:220px}.qr img{display:block;margin:0 auto 6px;border-radius:12px;border:1px solid var(--track)}.qr figcaption{font-size:13px}.scroll{overflow-x:auto}code{background:var(--butter-light);padding:2px 6px;border-radius:6px}form.inline{display:inline}
</style>
</head>
<body>
{{if .User}}<header><b>Ça mijote</b>
<a href="/admin/" {{if eq .Nav "home"}}class="on"{{end}}>Accueil</a>
<a href="/admin/meals" {{if eq .Nav "meals"}}class="on"{{end}}>Liste de repas</a>
<a href="/admin/recipes" {{if eq .Nav "recipes"}}class="on"{{end}}>Recettes</a>
<a href="/admin/tags" {{if eq .Nav "tags"}}class="on"{{end}}>Étiquettes</a>
<a href="/admin/accounts" {{if eq .Nav "accounts"}}class="on"{{end}}>Comptes</a>
<a href="/admin/invitations" {{if eq .Nav "invitations"}}class="on"{{end}}>Invitations</a>
<a href="/admin/tokens" {{if eq .Nav "tokens"}}class="on"{{end}}>Jetons API</a>
<a href="/admin/sessions" {{if eq .Nav "sessions"}}class="on"{{end}}>Sessions</a>
<a href="/admin/journal" {{if eq .Nav "journal"}}class="on"{{end}}>Journal</a>
<a href="/admin/account" {{if eq .Nav "account"}}class="on"{{end}}>Mon compte</a>
<form class="inline" method="post" action="/admin/logout"><input type="hidden" name="csrf" value="{{.CSRF}}"><button class="link">Déconnexion</button></form>
</header>{{end}}
<main>
<h1>{{.Title}}</h1>
{{if .Error}}<p class="error">{{.Error}}</p>{{end}}
{{if .Notice}}<p class="notice">{{.Notice}}</p>{{end}}
{{template "content" .}}
</main>
</body>
</html>
