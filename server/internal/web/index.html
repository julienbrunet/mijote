{{define "page-head"}}<script defer src="/app/planner.js"></script>{{end}}
{{define "page-body"}}
<section class="login card">
  <h1>Connexion</h1>
  <form id="login">
    <label>Identifiant<input name="username" autocomplete="username" required></label>
    <label>Mot de passe<input name="password" autocomplete="current-password" required></label>
    <button class="primary">Se connecter</button>
  </form>
</section>
{{end}}
{{define "page-end"}}
<template id="management-menu">{{template "manage-menu" .Shell}}</template>
<div id="status" role="status" class="status" hidden></div>
<dialog id="panel" aria-labelledby="panel-title"></dialog>
<noscript>Activez JavaScript pour retrouver votre menu partagé.</noscript>
{{end}}
