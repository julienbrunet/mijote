name: Server (API + web admin)

# Builds only when the backend changes; publishes a GitHub release on `server-vX.Y.Z` tags.
on:
  push:
    branches: [main, "claude/**"]
    paths: ["server/**", ".github/workflows/server.yml"]
    tags: ["server-v*"]
  pull_request:
    paths: ["server/**", ".github/workflows/server.yml"]
  # Manual release: run on main with a version (e.g. 0.1.0); GitHub creates the tag.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (X.Y.Z); empty = build only"
        required: false

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

defaults:
  run:
    working-directory: server

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Disposable PostgreSQL for the integration tests (migrations, auth flow).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Vet and test
        env:
          MIJOTE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: |
          go vet ./...
          go test ./...

      # Pure Go cross-compilation: one runner builds every target, no QEMU or matrix needed.
      - name: Build binaries
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then
            version="$INPUT_VERSION"
          elif [[ "$GITHUB_REF" == refs/tags/server-v* ]]; then
            version="${GITHUB_REF#refs/tags/server-v}"
          else
            version="0.0.0-dev+${GITHUB_SHA::7}"
          fi
          mkdir -p dist
          for target in linux/amd64 linux/arm64 linux/arm/7; do
            IFS=/ read -r os arch arm <<< "$target"
            suffix="$os-$arch${arm:+v$arm}"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch GOARM=$arm \
              go build -trimpath -ldflags "-s -w -X main.version=$version" \
              -o "dist/mijote-server-$version-$suffix" .
          done
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/server-v') || (inputs.version != '' && github.ref == 'refs/heads/main')
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          tag="${INPUT_VERSION:+server-v$INPUT_VERSION}"
          tag="${tag:-$GITHUB_REF_NAME}"
          [[ "$tag" =~ ^server-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "invalid version: $tag"; exit 1; }
          gh release create "$tag" dist/* --target "$GITHUB_SHA" \
            --title "Server ${tag#server-v}" --generate-notes
